<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assam LULC District GIS Dashboard</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #0f172a; color: #f8fafc; }

    #map { flex: 1; height: 100%; z-index: 1; }

    #sidebar {
      width: 400px;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      z-index: 2;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    h2 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    p.subtext { font-size: 0.82rem; color: #94a3b8; }

    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid #334155;
    }

    .card h3 { font-size: 0.92rem; margin-bottom: 8px; color: #e2e8f0; }

    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #cbd5e1; }
    .color-box { width: 12px; height: 12px; border-radius: 2px; }

    .slider-container { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
    input[type="range"] { accent-color: #38bdf8; cursor: pointer; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar">
    <div>
      <h2>Assam LULC Explorer</h2>
      <p class="subtext">District-level Land Classification Analytics</p>
    </div>

    <!-- Dynamic District Card -->
    <div class="card" id="district-info">
      <h3 id="district-name">Select a District</h3>
      <p id="district-meta" class="subtext">Click any boundary to load land use ratios.</p>
      <div style="margin-top: 12px; height: 210px;">
        <canvas id="lulcChart"></canvas>
      </div>
    </div>

    <!-- Transparency Slider -->
    <div class="card">
      <h3>LULC Layer Transparency</h3>
      <div class="slider-container">
        <input type="range" id="lulc-opacity" min="0" max="1" step="0.05" value="0.75" />
      </div>
    </div>

    <!-- Legend -->
    <div class="card">
      <h3>Classification Key</h3>
      <div class="legend-grid">
        <div class="legend-item"><span class="color-box" style="background: #1b7837;"></span> Forest</div>
        <div class="legend-item"><span class="color-box" style="background: #a6d96a;"></span> Tea / Agro</div>
        <div class="legend-item"><span class="color-box" style="background: #ffffbf;"></span> Cropland</div>
        <div class="legend-item"><span class="color-box" style="background: #2b83ba;"></span> Water</div>
        <div class="legend-item"><span class="color-box" style="background: #d7191c;"></span> Built-up</div>
        <div class="legend-item"><span class="color-box" style="background: #fdae61;"></span> Barren / Chars</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', {
      center: [26.2006, 92.9376],
      zoom: 8
    });

    // Google Earth Hybrid Satellite Base Layer
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Imagery &copy; Google'
    }).addTo(map);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    // LULC Raster Overlay (replace with your exported png/tiles)
    const lulcBounds = [[24.1, 89.6], [28.0, 96.1]];
    const lulcOverlay = L.imageOverlay('assam_lulc.png', lulcBounds, {
      opacity: 0.75
    }).addTo(map);

    document.getElementById('lulc-opacity').addEventListener('input', (e) => {
      lulcOverlay.setOpacity(e.target.value);
    });

    // District Handling & Chart Binding
    let districtLayer;
    let chartInstance = null;

    function style(feature) {
      return {
        fillColor: '#38bdf8',
        weight: 1.5,
        opacity: 0.8,
        color: '#93c5fd',
        dashArray: '3',
        fillOpacity: 0.05
      };
    }

    function highlightFeature(e) {
      const layer = e.target;
      layer.setStyle({
        weight: 2.5,
        color: '#fbbf24',
        dashArray: '',
        fillOpacity: 0.25
      });
      layer.bringToFront();
    }

    function resetHighlight(e) {
      districtLayer.resetStyle(e.target);
    }

    function renderChart(name, dataValues) {
      document.getElementById('district-name').innerText = name;
      document.getElementById('district-meta').innerText = 'Area Percentage by Class (%)';

      const ctx = document.getElementById('lulcChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Forest', 'Tea/Agro', 'Cropland', 'Water', 'Built-up', 'Barren'],
          datasets: [{
            data: dataValues,
            backgroundColor: ['#1b7837', '#a6d96a', '#ffffbf', '#2b83ba', '#d7191c', '#fdae61'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 8, color: '#94a3b8', font: { size: 10 } }
            }
          }
        }
      });
    }

    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight,
        click: (e) => {
          map.fitBounds(e.target.getBounds(), { padding: [40, 40] });

          const props = feature.properties;
          const districtName = props.name || props.DISTRICT || "District";

          // Pull real percentages calculated by python script (fallback if missing)
          const dataValues = [
            props.pct_forest || 0,
            props.pct_tea_agro || 0,
            props.pct_cropland || 0,
            props.pct_water || 0,
            props.pct_builtup || 0,
            props.pct_barren || 0
          ];

          renderChart(districtName, dataValues);
        }
      });
    }

    // Load GeoJSON
    fetch('assam_districts_lulc.geojson')
      .then(res => res.json())
      .then(data => {
        districtLayer = L.geoJSON(data, {
          style: style,
          onEachFeature: onEachFeature
        }).addTo(map);
      })
      .catch(err => console.error('Error loading GeoJSON:', err));

    L.control.layers(
      { "Google Hybrid": googleHybrid, "OpenStreetMap": osm },
      { "LULC Overlay": lulcOverlay },
      { position: 'topright' }
    ).addTo(map);
  </script>
</body>
</html>
