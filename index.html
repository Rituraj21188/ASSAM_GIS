<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Assam 2026 LULC GeoTIFF Pseudo-Color Portal</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- GeoTIFF In-Browser Renderers -->
  <script src="https://unpkg.com/georaster"></script>
  <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #050811;
      color: #f1f5f9;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      z-index: 1;
      background: #050811;
    }

    /* Desktop Sidebar */
    #sidebar {
      width: 430px;
      height: 100%;
      background: rgba(8, 12, 24, 0.96);
      backdrop-filter: blur(16px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      z-index: 1000;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: -10px 0 36px rgba(0, 0, 0, 0.75);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .header-box { display: flex; justify-content: space-between; align-items: flex-start; }
    h2 { font-size: 1.2rem; font-weight: 700; color: #38bdf8; letter-spacing: -0.02em; }
    p.subtext { font-size: 0.76rem; color: #94a3b8; }

    #status-badge {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: #0284c7;
      color: white;
      font-weight: 600;
      display: inline-block;
      margin-top: 4px;
    }

    .card {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid #1e293b;
    }

    .card h3 { 
      font-size: 0.82rem; 
      margin-bottom: 8px; 
      color: #f8fafc; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-label { font-size: 0.74rem; color: #94a3b8; display: block; margin-bottom: 4px; font-weight: 600; }

    select {
      width: 100%;
      background: #060a14;
      border: 1px solid #1e293b;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: #38bdf8; }

    .slider-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.76rem;
      color: #94a3b8;
    }
    input[type="range"] { accent-color: #38bdf8; cursor: pointer; }

    /* Custom Toggle Switch */
    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: #cbd5e1;
      padding: 2px 0;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(18px); }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.78rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-tag { display: flex; align-items: center; gap: 8px; }
    .stat-pill { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; }
    .stat-val { font-weight: 700; color: #f8fafc; }

    .leaflet-control-custom {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* -------------------------------------------------------------
       MOBILE & ANDROID RESPONSIVENESS (< 768px)
    -------------------------------------------------------------- */
    @media (max-width: 768px) and (orientation: portrait) {
      #app-container { flex-direction: column; }
      #map { position: absolute; inset: 0; height: 100%; }

      #sidebar {
        position: absolute; bottom: 0; left: 0; width: 100%; max-height: 52vh;
        border-left: none; border-top: 2px solid rgba(56, 189, 248, 0.4);
        border-top-left-radius: 18px; border-top-right-radius: 18px;
        box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.9);
        padding: 10px 14px 20px 14px;
        transform: translateY(0);
      }

      #sidebar.collapsed { transform: translateY(calc(100% - 44px)); }

      .mobile-toggle-btn {
        display: flex !important;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 24px;
        background: transparent;
        border: none;
        cursor: pointer;
        margin-bottom: 4px;
      }

      .drawer-handle-bar { width: 44px; height: 5px; background: #475569; border-radius: 3px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      #app-container { flex-direction: row; }
      #map { position: relative; flex: 1; height: 100%; }
      #sidebar {
        position: relative; width: 320px; height: 100%; max-height: 100vh;
        border-top: none; border-left: 2px solid rgba(56, 189, 248, 0.4);
        border-radius: 0; padding: 12px;
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.85);
        transform: none !important;
      }
      .mobile-toggle-btn { display: none !important; }
      h2 { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="map"></div>

    <div id="sidebar">
      <button class="mobile-toggle-btn" id="drawer-toggle" aria-label="Toggle Panel" style="display: none;">
        <div class="drawer-handle-bar"></div>
      </button>

      <div class="header-box">
        <div>
          <h2>Assam LULC GeoTIFF Shader</h2>
          <p class="subtext">Dynamic In-Browser Raster Pseudocolor Engine</p>
          <span id="status-badge">Streaming GeoTIFF...</span>
        </div>
      </div>

      <!-- Basemap Toggle Card -->
      <div class="card">
        <div class="switch-row">
          <span>Satellite Basemap</span>
          <label class="switch">
            <input type="checkbox" id="basemap-toggle" checked />
            <span class="slider"></span>
          </label>
        </div>
        <p style="font-size:0.7rem; color:#64748b; margin-top:4px;">Toggle OFF to isolate the pure raster on a dark backdrop (QGIS Mode).</p>
      </div>

      <!-- Pseudocolor Ramp Selector -->
      <div class="card">
        <label class="input-label" for="raster-ramp-select">🎨 GeoTIFF Pseudocolor Ramp:</label>
        <select id="raster-ramp-select">
          <option value="qgis_viridis" selected>🟢 QGIS Viridis (Fluorescent Rivers & Canopy)</option>
          <option value="cyberpunk">⚡ Cyberpunk Neon (High Contrast)</option>
          <option value="dynamic_world">🌍 ESA Dynamic World Standard</option>
          <option value="spectral">🌈 Spectral Continuous</option>
          <option value="magma">🌋 Magma / Thermal Glow</option>
        </select>
      </div>

      <!-- District Selection -->
      <div class="card">
        <label class="input-label" for="district-dropdown">Inspect District:</label>
        <select id="district-dropdown">
          <option value="">-- Choose District to Zoom --</option>
        </select>
      </div>

      <!-- Transparency Sliders -->
      <div class="card">
        <div class="slider-box">
          <div style="display: flex; justify-content: space-between;">
            <span>GeoTIFF Raster Opacity</span>
            <span id="raster-opacity-val">85%</span>
          </div>
          <input type="range" id="raster-opacity" min="0" max="1" step="0.05" value="0.85" />
        </div>
        <div class="slider-box" style="margin-top: 8px;">
          <div style="display: flex; justify-content: space-between;">
            <span>District Boundary Outlines</span>
            <span id="vector-opacity-val">40%</span>
          </div>
          <input type="range" id="vector-opacity" min="0" max="1" step="0.05" value="0.40" />
        </div>
      </div>

      <!-- Statistics Chart -->
      <div class="card">
        <h3>
          <span id="panel-title">Assam State Metrics</span>
        </h3>
        <div style="margin-top: 6px; height: 140px; position: relative;">
          <canvas id="lulcChart"></canvas>
        </div>
        <div id="stat-list" style="margin-top: 8px;"></div>
      </div>

      <!-- Legend -->
      <div class="card">
        <h3>Active Pseudocolor Shader Key</h3>
        <div id="legend-items" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px;"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. BOUNDING BOX: Locks camera firmly to Assam and Northeast India
    const assamBounds = L.latLngBounds(
      L.latLng(23.6, 89.2),
      L.latLng(28.6, 96.6)
    );

    const map = L.map('map', {
      center: [26.2006, 92.9376],
      zoom: window.innerWidth < 768 ? 7 : 8,
      minZoom: 6,
      maxZoom: 18,
      maxBounds: assamBounds,
      maxBoundsViscosity: 1.0,
      zoomControl: true
    });

    // Dedicated Panes for strict Z-ordering
    map.createPane('rasterPane');
    map.getPane('rasterPane').style.zIndex = 400;

    map.createPane('districtPane');
    map.getPane('districtPane').style.zIndex = 500;

    // Google Satellite Base Layer
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Map &copy; Google'
    }).addTo(map);

    // Mobile Viewport Invalidation
    window.addEventListener('resize', () => { map.invalidateSize(); });
    window.addEventListener('orientationchange', () => { setTimeout(() => { map.invalidateSize(); }, 250); });

    // Drawer handle collapse for mobile
    const sidebar = document.getElementById('sidebar');
    const drawerToggle = document.getElementById('drawer-toggle');
    if (drawerToggle) {
      drawerToggle.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        setTimeout(() => { map.invalidateSize(); }, 320);
      });
    }

    // Reset View Button
    const ResetControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function() {
        const btn = L.DomUtil.create('button', 'leaflet-control-custom');
        btn.innerHTML = '↺ Reset View';
        btn.onclick = () => {
          if (districtLayer) map.fitBounds(districtLayer.getBounds(), { padding: [15, 15] });
        };
        return btn;
      }
    });
    map.addControl(new ResetControl());

    let parsedGeoraster = null;
    let rasterLayer = null;
    let districtLayer = null;
    let chartInstance = null;
    let geojsonData = null;
    let districtLookup = {};
    let selectedDistrictName = null;
    let currentRasterOpacity = 0.85;
    let currentVectorOpacity = 0.40;
    let currentRampKey = 'qgis_viridis';

    // RASTER SHADER PALETTES (Maps Band values 1 through 8 directly to colors)
    const SHADER_PALETTES = {
      qgis_viridis: {
        name: "QGIS Viridis",
        1: { hex: "#440154", label: "Dense Forest Canopy" },   // Deep Indigo
        2: { hex: "#3b528b", label: "Tea / Agroforestry" },    // Blue
        3: { hex: "#21918c", label: "Grassland Plains" },      // Teal
        4: { hex: "#5ec962", label: "Cropland Agriculture" },  // Light Green
        5: { hex: "#31688e", label: "Urban Built-up" },        // Dark Cyan
        6: { hex: "#8fd744", label: "Sandbars / Chars" },      // Yellow Green
        8: { hex: "#fde725", label: "River Channels & Water" } // Glowing River Yellow[cite: 24]
      },
      cyberpunk: {
        name: "Cyberpunk Neon",
        1: { hex: "#00e676", label: "Dense Forest Canopy" },
        2: { hex: "#aeea00", label: "Tea / Agroforestry" },
        3: { hex: "#76ff03", label: "Grassland Plains" },
        4: { hex: "#ffd600", label: "Cropland Agriculture" },
        5: { hex: "#ff1744", label: "Urban Built-up" },
        6: { hex: "#ff6d00", label: "Sandbars / Chars" },
        8: { hex: "#00e5ff", label: "River Channels & Water" }
      },
      dynamic_world: {
        name: "ESA Dynamic World",
        1: { hex: "#397d49", label: "Dense Forest Canopy" },
        2: { hex: "#88b053", label: "Tea / Agroforestry" },
        3: { hex: "#e49635", label: "Grassland Plains" },
        4: { hex: "#dfc35a", label: "Cropland Agriculture" },
        5: { hex: "#c4281b", label: "Urban Built-up" },
        6: { hex: "#a59b8f", label: "Sandbars / Chars" },
        8: { hex: "#419bdf", label: "River Channels & Water" }
      },
      spectral: {
        name: "Spectral",
        1: { hex: "#2b83ba", label: "Dense Forest Canopy" },
        2: { hex: "#abdda4", label: "Tea / Agroforestry" },
        3: { hex: "#e6f598", label: "Grassland Plains" },
        4: { hex: "#ffffbf", label: "Cropland Agriculture" },
        5: { hex: "#d7191c", label: "Urban Built-up" },
        6: { hex: "#fdae61", label: "Sandbars / Chars" },
        8: { hex: "#5e4fa2", label: "River Channels & Water" }
      },
      magma: {
        name: "Magma Thermal",
        1: { hex: "#000004", label: "Dense Forest Canopy" },
        2: { hex: "#3b0f70", label: "Tea / Agroforestry" },
        3: { hex: "#8c2981", label: "Grassland Plains" },
        4: { hex: "#de4968", label: "Cropland Agriculture" },
        5: { hex: "#fe9f6d", label: "Urban Built-up" },
        6: { hex: "#fcfdbf", label: "Sandbars / Chars" },
        8: { hex: "#f1605d", label: "River Channels & Water" }
      }
    };

    // Dynamic Shader Function
    function applyRasterShader() {
      if (!parsedGeoraster) return;

      if (rasterLayer) {
        map.removeLayer(rasterLayer);
      }

      const activeShader = SHADER_PALETTES[currentRampKey];

      rasterLayer = new GeoRasterLayer({
        georaster: parsedGeoraster,
        opacity: currentRasterOpacity,
        pane: 'rasterPane',
        pixelValuesToColorFn: values => {
          const val = Math.round(values[0]);
          if (val === 0 || !activeShader[val]) {
            return null; // Transparent for background/NoData[cite: 9]
          }
          return activeShader[val].hex;
        },
        resolution: 256
      });

      rasterLayer.addTo(map);
      updateLegend();
    }

    function updateLegend() {
      const shader = SHADER_PALETTES[currentRampKey];
      let html = '';
      Object.keys(shader).forEach(code => {
        if (code === 'name') return;
        const item = shader[code];
        html += `
          <div class="stat-row" style="border: none; padding: 2px 0;">
            <div class="stat-tag">
              <span class="stat-pill" style="background: ${item.hex};"></span>
              <span style="font-size:0.73rem;">${item.label}</span>
            </div>
            <span style="font-size:0.7rem; color:#64748b;">(Class ${code})</span>
          </div>
        `;
      });
      document.getElementById('legend-items').innerHTML = html;
    }

    function updateChart(title, properties) {
      document.getElementById('panel-title').innerText = title;

      const labels = ['Forest', 'Tea/Agro', 'Cropland', 'Water', 'Built-up', 'Barren'];
      const values = [
        parseFloat(properties.pct_forest || 0),
        parseFloat(properties.pct_shrub_tea || 0),
        parseFloat(properties.pct_cropland || 0),
        parseFloat(properties.pct_water || 0),
        parseFloat(properties.pct_builtup || 0),
        parseFloat(properties.pct_barren || 0)
      ];

      const activeShader = SHADER_PALETTES[currentRampKey];
      const colors = [
        activeShader[1].hex,
        activeShader[2].hex,
        activeShader[4].hex,
        activeShader[8].hex,
        activeShader[5].hex,
        activeShader[6].hex
      ];

      let statHtml = '';
      labels.forEach((label, idx) => {
        statHtml += `
          <div class="stat-row">
            <div class="stat-tag">
              <span class="stat-pill" style="background: ${colors[idx]};"></span>
              <span>${label}</span>
            </div>
            <span class="stat-val">${values[idx].toFixed(1)}%</span>
          </div>
        `;
      });
      document.getElementById('stat-list').innerHTML = statHtml;

      const ctx = document.getElementById('lulcChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } }
        }
      });
    }

    function selectDistrict(name) {
      selectedDistrictName = name;
      const item = districtLookup[name];
      if (!item) return;

      if (districtLayer) {
        districtLayer.setStyle(f => ({
          pane: 'districtPane',
          fillColor: '#000000',
          fillOpacity: 0.05,
          weight: (f.properties?.name || f.properties?.DISTRICT) === name ? 3.5 : 1.2,
          color: (f.properties?.name || f.properties?.DISTRICT) === name ? '#38bdf8' : '#ffffff',
          opacity: currentVectorOpacity
        }));
      }

      item.layer.bringToFront();

      const isMobilePortrait = (window.innerWidth < 768 && window.innerHeight > window.innerWidth);
      const paddingBottom = isMobilePortrait ? 220 : 30;

      map.fitBounds(item.layer.getBounds(), {
        paddingTopLeft: [20, 20],
        paddingBottomRight: [20, paddingBottom]
      });

      updateChart(name, item.feature.properties);
      document.getElementById('district-dropdown').value = name;
    }

    // 2. Fetch and apply shader to Assam_LULC_2026.tif[cite: 2]
    fetch('Assam_LULC_2026.tif')
      .then(res => {
        if (!res.ok) throw new Error("Could not find Assam_LULC_2026.tif in repository.");
        return res.arrayBuffer();
      })
      .then(parseGeoraster)
      .then(georaster => {
        parsedGeoraster = georaster;
        document.getElementById('status-badge').innerText = 'Raster Shader Active';
        document.getElementById('status-badge').style.background = '#15803d';
        applyRasterShader();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('status-badge').innerText = 'Raster Error (Verify File)';
        document.getElementById('status-badge').style.background = '#b91c1c';
      });

    // 3. Load District Outlines[cite: 2]
    fetch('assam_districts.geojson.json')
      .then(res => res.json())
      .then(data => {
        data.features = data.features.filter(f => 
          f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon')
        );
        geojsonData = data;

        const dropdown = document.getElementById('district-dropdown');
        data.features.forEach(f => {
          const name = f.properties?.name || f.properties?.DISTRICT || f.properties?.district;
          if (name) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.innerText = name;
            dropdown.appendChild(opt);
          }
        });

        districtLayer = L.geoJSON(data, {
          pane: 'districtPane',
          style: {
            fillColor: '#000000',
            fillOpacity: 0.05,
            weight: 1.2,
            opacity: currentVectorOpacity,
            color: '#ffffff',
            dashArray: '2'
          },
          onEachFeature: (feature, layer) => {
            const name = feature.properties?.name || feature.properties?.DISTRICT;
            districtLookup[name] = { layer, feature };
            layer.on('click', () => selectDistrict(name));
          }
        }).addTo(map);

        if (data.features.length > 0) {
          updateChart("Assam State Average", data.features[0].properties);
        }
      })
      .catch(err => console.error("Error loading district GeoJSON:", err));

    // Basemap Toggle Handler
    document.getElementById('basemap-toggle').addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!map.hasLayer(googleHybrid)) map.addLayer(googleHybrid);
      } else {
        if (map.hasLayer(googleHybrid)) map.removeLayer(googleHybrid);
      }
    });

    // Controls Event Listeners
    document.getElementById('raster-ramp-select').addEventListener('change', (e) => {
      currentRampKey = e.target.value;
      applyRasterShader();
      if (selectedDistrictName && districtLookup[selectedDistrictName]) {
        updateChart(selectedDistrictName, districtLookup[selectedDistrictName].feature.properties);
      }
    });

    document.getElementById('district-dropdown').addEventListener('change', (e) => {
      if (e.target.value) selectDistrict(e.target.value);
    });

    document.getElementById('raster-opacity').addEventListener('input', (e) => {
      currentRasterOpacity = parseFloat(e.target.value);
      document.getElementById('raster-opacity-val').innerText = `${Math.round(currentRasterOpacity * 100)}%`;
      if (rasterLayer) rasterLayer.setOpacity(currentRasterOpacity);
    });

    document.getElementById('vector-opacity').addEventListener('input', (e) => {
      currentVectorOpacity = parseFloat(e.target.value);
      document.getElementById('vector-opacity-val').innerText = `${Math.round(currentVectorOpacity * 100)}%`;
      if (districtLayer) {
        districtLayer.setStyle({ opacity: currentVectorOpacity });
      }
    });
  </script>
</body>
</html>
