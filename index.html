<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assam 2026 LULC Analytics</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #0b0f17; color: #e2e8f0; overflow: hidden; }

    #map { flex: 1; height: 100%; z-index: 1; }

    #sidebar {
      width: 400px;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      z-index: 2;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    h2 { font-size: 1.3rem; font-weight: 700; color: #38bdf8; }
    p.subtext { font-size: 0.82rem; color: #94a3b8; }

    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid #334155;
    }

    .card h3 { font-size: 0.95rem; margin-bottom: 6px; color: #f1f5f9; }

    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #cbd5e1; }
    .color-box { width: 14px; height: 14px; border-radius: 3px; }

    .btn-3d {
      display: inline-block;
      text-align: center;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn-3d:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar">
    <div>
      <h2>Assam 2026 LULC Explorer</h2>
      <p class="subtext">GIS Analytics & District Land Classification</p>
    </div>

    <a href="three_view.html" class="btn-3d">Switch to 3D Extruded Model &rarr;</a>

    <!-- District Card -->
    <div class="card">
      <h3 id="district-name">Select a District</h3>
      <p id="district-meta" class="subtext">Hover or click any district boundary to display LULC distribution.</p>
      <div style="margin-top: 14px; height: 220px;">
        <canvas id="lulcChart"></canvas>
      </div>
    </div>

    <!-- Legend -->
    <div class="card">
      <h3>Classification Key</h3>
      <div class="legend-grid">
        <div class="legend-item"><span class="color-box" style="background: #1b7837;"></span> Forest</div>
        <div class="legend-item"><span class="color-box" style="background: #a6d96a;"></span> Tea / Agro</div>
        <div class="legend-item"><span class="color-box" style="background: #ffffbf;"></span> Cropland</div>
        <div class="legend-item"><span class="color-box" style="background: #2b83ba;"></span> Water</div>
        <div class="legend-item"><span class="color-box" style="background: #d7191c;"></span> Built-up</div>
        <div class="legend-item"><span class="color-box" style="background: #fdae61;"></span> Barren / Sandbars</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', {
      center: [26.2006, 92.9376],
      zoom: 8
    });

    // Google Earth Hybrid Satellite
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Map &copy; Google'
    }).addTo(map);

    let districtLayer = null;
    let chartInstance = null;

    function renderChart(name, values) {
      document.getElementById('district-name').innerText = name;
      document.getElementById('district-meta').innerText = 'Relative Area Coverage (%)';

      const labels = ['Forest', 'Tea/Agro', 'Cropland', 'Water', 'Built-up', 'Barren'];
      const bgColors = ['#1b7837', '#a6d96a', '#ffffbf', '#2b83ba', '#d7191c', '#fdae61'];

      const ctx = document.getElementById('lulcChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: bgColors,
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 8, color: '#94a3b8', font: { size: 10 } } }
          }
        }
      });
    }

    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: (e) => {
          e.target.setStyle({ weight: 3, color: '#f59e0b', fillOpacity: 0.35 });
          e.target.bringToFront();
        },
        mouseout: (e) => {
          districtLayer.resetStyle(e.target);
        },
        click: (e) => {
          map.fitBounds(e.target.getBounds(), { padding: [35, 35] });

          const props = feature.properties || {};
          const dName = props.name || props.DISTRICT || "District";

          // Read calculated zonal stats directly from GeoJSON properties
          const vals = [
            props.pct_forest ?? 0,
            props.pct_tea_agro ?? 0,
            props.pct_cropland ?? 0,
            props.pct_water ?? 0,
            props.pct_builtup ?? 0,
            props.pct_barren ?? 0
          ];

          renderChart(dName, vals);
        }
      });
    }

    // Load GeoJSON directly from the updated repository file
    fetch('assam_districts.geojson.json')
      .then(res => res.json())
      .then(data => {
        districtLayer = L.geoJSON(data, {
          style: {
            fillColor: '#0284c7',
            weight: 1.5,
            opacity: 0.9,
            color: '#38bdf8',
            dashArray: '3',
            fillOpacity: 0.12
          },
          onEachFeature: onEachFeature
        }).addTo(map);

        // Render first district automatically
        if (data.features && data.features.length > 0) {
          const first = data.features[0].properties;
          renderChart(first.name || "Assam", [
            first.pct_forest ?? 30,
            first.pct_tea_agro ?? 15,
            first.pct_cropland ?? 35,
            first.pct_water ?? 10,
            first.pct_builtup ?? 5,
            first.pct_barren ?? 5
          ]);
        }
      })
      .catch(err => console.error("Error loading GeoJSON:", err));
  </script>
</body>
</html>
