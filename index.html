<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Assam 2026 LULC Analytics Portal</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      background: #0b0f17;
      color: #e2e8f0;
      overflow: hidden;
      display: flex;
    }

    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      z-index: 1;
    }

    /* Desktop Sidebar */
    #sidebar {
      width: 420px;
      height: 100%;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      z-index: 1000;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    h2 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    p.subtext { font-size: 0.8rem; color: #94a3b8; }

    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 14px;
      border: 1px solid #334155;
    }

    .card h3 { font-size: 0.9rem; margin-bottom: 6px; color: #f1f5f9; }

    /* Search & Filter Controls */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input[type="text"], select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: #38bdf8;
    }

    /* Stat Item Breakdown */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #334155;
      font-size: 0.8rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-tag { display: flex; align-items: center; gap: 8px; }
    .stat-pill { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .stat-val { font-weight: 600; color: #f8fafc; }

    .btn-3d {
      display: block;
      text-align: center;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
      transition: background 0.2s;
    }
    .btn-3d:hover { background: #0369a1; }

    .drawer-handle {
      display: none;
      width: 44px;
      height: 5px;
      background: #475569;
      border-radius: 3px;
      margin: 0 auto 8px auto;
    }

    /* Mobile Drawer */
    @media (max-width: 768px) {
      body { flex-direction: column; }

      #map {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
      }

      #sidebar {
        position: absolute;
        bottom: 0; left: 0;
        width: 100%;
        max-height: 52vh;
        border-left: none;
        border-top: 2px solid rgba(56, 189, 248, 0.4);
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.7);
        padding: 12px 16px 24px 16px;
      }

      .drawer-handle { display: block; }
      h2 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar">
    <div class="drawer-handle"></div>

    <div>
      <h2>Assam 2026 LULC Explorer</h2>
      <p class="subtext">GIS Analytics & Interactive Land Classification</p>
    </div>

    <!-- Search & Thematic Controls -->
    <div class="card control-group">
      <input type="text" id="district-search" list="district-list" placeholder="🔍 Search District (e.g. Jorhat, Kamrup)..." />
      <datalist id="district-list"></datalist>

      <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
        <label for="theme-filter" style="font-size: 0.75rem; color: #94a3b8; white-space: nowrap;">Map Layer:</label>
        <select id="theme-filter">
          <option value="dominant">Dominant Land Cover</option>
          <option value="pct_forest">Forest / Tree Cover (%)</option>
          <option value="pct_cropland">Cropland / Agriculture (%)</option>
          <option value="pct_water">Water Bodies (%)</option>
          <option value="pct_shrub_tea">Tea & Shrubland (%)</option>
          <option value="pct_builtup">Built-up Settlements (%)</option>
        </select>
      </div>
    </div>

    <a href="three_view.html" class="btn-3d">Switch to 3D Extruded Model &rarr;</a>

    <!-- Active District Card -->
    <div class="card">
      <h3 id="district-name">Select a District</h3>
      <p id="district-meta" class="subtext">Displaying land-use metrics</p>
      
      <div style="margin-top: 8px; height: 160px; position: relative;">
        <canvas id="lulcChart"></canvas>
      </div>

      <div id="stat-list" style="margin-top: 10px;"></div>
    </div>

    <!-- Legend -->
    <div class="card">
      <h3 id="legend-title">Classification Key</h3>
      <div id="legend-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;">
        <div class="stat-tag"><span class="stat-pill" style="background: #1b7837;"></span> <span style="font-size:0.75rem;">Forest Cover</span></div>
        <div class="stat-tag"><span class="stat-pill" style="background: #78c679;"></span> <span style="font-size:0.75rem;">Shrub / Tea</span></div>
        <div class="stat-tag"><span class="stat-pill" style="background: #fecc5c;"></span> <span style="font-size:0.75rem;">Cropland</span></div>
        <div class="stat-tag"><span class="stat-pill" style="background: #2b83ba;"></span> <span style="font-size:0.75rem;">Water Bodies</span></div>
        <div class="stat-tag"><span class="stat-pill" style="background: #e31a1c;"></span> <span style="font-size:0.75rem;">Built-up Area</span></div>
        <div class="stat-tag"><span class="stat-pill" style="background: #d95f0e;"></span> <span style="font-size:0.75rem;">Barren / Chars</span></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', {
      center: [26.2006, 92.9376],
      zoom: window.innerWidth < 768 ? 7 : 8,
      zoomControl: true
    });

    // 1. Google Earth Hybrid Satellite Base Layer
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Map &copy; Google'
    }).addTo(map);

    // 2. CRITICAL FIX: Create a dedicated Leaflet Vector Pane above the satellite layer
    map.createPane('districtPane');
    map.getPane('districtPane').style.zIndex = 500; // Always above tileLayer (which is 200)

    let districtLayer = null;
    let chartInstance = null;
    let selectedLayer = null;
    let geojsonData = null;
    let districtLookup = {};
    let currentTheme = 'dominant';

    const classes = [
      { key: 'pct_forest', label: 'Forest / Tree Cover', color: '#1b7837' },
      { key: 'pct_shrub_tea', label: 'Shrub / Tea Gardens', color: '#78c679' },
      { key: 'pct_cropland', label: 'Cropland / Agriculture', color: '#fecc5c' },
      { key: 'pct_water', label: 'Water (Rivers/Wetlands)', color: '#2b83ba' },
      { key: 'pct_builtup', label: 'Built-up / Urban', color: '#e31a1c' },
      { key: 'pct_barren', label: 'Barren / River Chars', color: '#d95f0e' }
    ];

    // Single-metric color scale
    function getMetricColor(value, theme) {
      const v = parseFloat(value || 0);
      if (theme === 'pct_forest') {
        return v > 50 ? '#00441b' : v > 35 ? '#1b7837' : v > 20 ? '#78c679' : v > 10 ? '#c2e699' : '#a1d99b';
      } else if (theme === 'pct_cropland') {
        return v > 45 ? '#b35806' : v > 30 ? '#f1a340' : v > 15 ? '#fee08b' : '#ffffbf';
      } else if (theme === 'pct_water') {
        return v > 15 ? '#08306b' : v > 10 ? '#2171b5' : v > 5 ? '#6baed6' : '#c6dbef';
      } else if (theme === 'pct_builtup') {
        return v > 12 ? '#67000d' : v > 8 ? '#cb181d' : v > 4 ? '#fb6a4a' : '#fcae91';
      } else {
        return v > 20 ? '#006d2c' : v > 10 ? '#31a354' : '#74c476';
      }
    }

    // Determine dominant color dynamically if dominant_color property is absent
    function getDominantColor(props) {
      if (props.dominant_color) return props.dominant_color;
      let maxVal = -1;
      let dominantHex = '#0284c7';
      classes.forEach(c => {
        const val = parseFloat(props[c.key] || 0);
        if (val > maxVal) {
          maxVal = val;
          dominantHex = c.color;
        }
      });
      return dominantHex;
    }

    function getDistrictStyle(feature) {
      const p = feature.properties || {};
      let fillColor;

      if (currentTheme === 'dominant') {
        fillColor = getDominantColor(p);
      } else {
        fillColor = getMetricColor(p[currentTheme], currentTheme);
      }

      return {
        pane: 'districtPane', // Bound to custom top-level pane
        fillColor: fillColor,
        weight: 2,
        opacity: 1,
        color: '#ffffff', // High-contrast crisp white outline
        dashArray: '2',
        fillOpacity: currentTheme === 'dominant' ? 0.55 : 0.75
      };
    }

    function updateDetails(name, properties) {
      document.getElementById('district-name').innerText = name;
      document.getElementById('district-meta').innerText = 'Relative Area Percentage (%)';

      const values = [];
      const labels = [];
      const colors = [];
      let statListHtml = '';

      classes.forEach(c => {
        const val = parseFloat(properties[c.key] ?? 0);
        values.push(val);
        labels.push(c.label);
        colors.push(c.color);

        statListHtml += `
          <div class="stat-row">
            <div class="stat-tag">
              <span class="stat-pill" style="background: ${c.color};"></span>
              <span>${c.label}</span>
            </div>
            <span class="stat-val">${val.toFixed(1)}%</span>
          </div>
        `;
      });

      document.getElementById('stat-list').innerHTML = statListHtml;

      const ctx = document.getElementById('lulcChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: colors,
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    function highlightDistrict(layer, feature) {
      if (selectedLayer && districtLayer) {
        districtLayer.resetStyle(selectedLayer);
      }
      selectedLayer = layer;
      selectedLayer.setStyle({
        weight: 3.5,
        color: '#fbbf24',
        fillOpacity: 0.85
      });
      selectedLayer.bringToFront();

      const paddingBottom = window.innerWidth < 768 ? 220 : 40;
      map.fitBounds(layer.getBounds(), {
        paddingTopLeft: [20, 20],
        paddingBottomRight: [20, paddingBottom]
      });

      const props = feature.properties || {};
      const dName = props.name || props.DISTRICT || props.district || "Assam District";
      updateDetails(dName, props);
    }

    function onEachFeature(feature, layer) {
      const props = feature.properties || {};
      const dName = props.name || props.DISTRICT || props.district || "Assam District";
      districtLookup[dName.toLowerCase()] = { layer, feature };

      layer.on({
        mouseover: (e) => {
          if (window.innerWidth >= 768 && e.target !== selectedLayer) {
            e.target.setStyle({ weight: 3, color: '#fbbf24', fillOpacity: 0.8 });
            e.target.bringToFront();
          }
        },
        mouseout: (e) => {
          if (window.innerWidth >= 768 && e.target !== selectedLayer) {
            districtLayer.resetStyle(e.target);
          }
        },
        click: (e) => {
          highlightDistrict(e.target, feature);
        }
      });
    }

    // Load GeoJSON Dataset
    fetch('assam_districts.geojson.json')
      .then(res => res.json())
      .then(data => {
        geojsonData = data;
        const datalist = document.getElementById('district-list');

        // Populate search autocomplete
        data.features.forEach(f => {
          const name = f.properties?.name || f.properties?.DISTRICT || f.properties?.district;
          if (name) {
            const opt = document.createElement('option');
            opt.value = name;
            datalist.appendChild(opt);
          }
        });

        districtLayer = L.geoJSON(data, {
          pane: 'districtPane',
          style: getDistrictStyle,
          onEachFeature: onEachFeature
        }).addTo(map);

        // Preload first district
        if (data.features.length > 0) {
          const first = data.features[0];
          const firstName = first.properties?.name || "Assam District";
          updateDetails(firstName, first.properties);
        }
      })
      .catch(err => console.error("Error loading GeoJSON:", err));

    // Search bar listener
    document.getElementById('district-search').addEventListener('change', (e) => {
      const query = e.target.value.trim().toLowerCase();
      if (districtLookup[query]) {
        highlightDistrict(districtLookup[query].layer, districtLookup[query].feature);
      }
    });

    // Theme dropdown listener
    document.getElementById('theme-filter').addEventListener('change', (e) => {
      currentTheme = e.target.value;
      if (districtLayer) {
        districtLayer.setStyle(getDistrictStyle);
      }
      if (selectedLayer) {
        selectedLayer.setStyle({ weight: 3.5, color: '#fbbf24', fillOpacity: 0.85 });
      }
    });
  </script>
</body>
</html>
