name: Compute Zonal Statistics

on:
  workflow_dispatch: # Allows you to manually trigger it with a single click

jobs:
  run-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install GIS dependencies
        run: |
          pip install geopandas rasterio rasterstats

      - name: Run calculation script
        run: |
          python calculate_stats.py

      - name: Commit and push updated GeoJSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assam_districts.geojson.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-calculate district LULC zonal stats [skip ci]"
          git push
